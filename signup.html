<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — OGÉ Jewelry</title>
  <meta name="description" content="Create your OGÉ Fine Jewelry account to save wishlists, manage profile details, and track orders.">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/base.css?v=5.0">
  <link rel="stylesheet" href="assets/theme.css?v=5.0">

  <script src="assets/theme.js?v=5.0" defer></script>
</head>
<body class="template-customers-register">

  <div class="auth-page-wrapper">
    <div class="auth-split-grid">
      
      <!-- Left Column: Sign Up Multi-Step Form -->
      <div class="auth-form-column">
        <!-- Top Back Link -->
        <a href="login.html" class="auth-back-link" aria-label="Go Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Back</span>
        </a>

        <!-- Form Inner Container -->
        <div class="auth-form-inner">
          <a href="index.html" class="auth-logo-center" aria-label="OGÉ Home">
            <img src="assets/logo2.png" alt="OGÉ" class="auth-logo-img" width="90" height="28">
          </a>

          <p class="auth-step-badge" id="signup-step-badge">Step 1 of 2</p>
          <p class="auth-subtitle">More than a Jewelry. Its a feeling.</p>

          <form id="form-auth-signup" novalidate>
            
            <!-- ===============================================================
                 STEP 1: PERSONAL DETAILS (First Name, Last Name, Email)
                 =============================================================== -->
            <div class="auth-step is-active" id="signup-step-1">
              <!-- Name Fields Grid -->
              <div class="auth-form-grid-2">
                <div class="form-group-line">
                  <label for="signup-firstname" class="form-label-line">First name *</label>
                  <div class="form-input-line-wrap">
                    <input type="text" id="signup-firstname" class="form-input-line" placeholder="Enter first name" required autocomplete="given-name">
                  </div>
                </div>

                <div class="form-group-line">
                  <label for="signup-lastname" class="form-label-line">Last name *</label>
                  <div class="form-input-line-wrap">
                    <input type="text" id="signup-lastname" class="form-input-line" placeholder="Enter last name" required autocomplete="family-name">
                  </div>
                </div>
              </div>

              <!-- Email Field -->
              <div class="form-group-line">
                <label for="signup-email" class="form-label-line">Email address *</label>
                <div class="form-input-line-wrap">
                  <input type="email" id="signup-email" class="form-input-line" placeholder="name@email.com" required autocomplete="email">
                </div>
              </div>

              <!-- Next Button -->
              <button type="button" class="auth-btn-primary" id="btn-signup-step1-next">Next</button>

              <!-- Footer Prompt -->
              <p class="auth-footer-prompt">
                Already have an account? <a href="login.html">Log in</a>
              </p>
            </div>

            <!-- ===============================================================
                 STEP 2: SECURITY & PASSWORD
                 =============================================================== -->
            <div class="auth-step" id="signup-step-2">
              <!-- Password Field -->
              <div class="form-group-line">
                <label for="signup-password" class="form-label-line">Password*</label>
                <div class="form-input-line-wrap">
                  <input type="password" id="signup-password" class="form-input-line" placeholder="Enter password" required autocomplete="new-password">
                  <button type="button" class="password-eye-btn" data-toggle-password="signup-password" aria-label="Show password" title="Show password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                      <line x1="2" y1="2" x2="22" y2="22"></line>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Re-type Password Field -->
              <div class="form-group-line">
                <label for="signup-confirm-password" class="form-label-line">Re-type password*</label>
                <div class="form-input-line-wrap">
                  <input type="password" id="signup-confirm-password" class="form-input-line" placeholder="Re-type password" required autocomplete="new-password">
                  <button type="button" class="password-eye-btn" data-toggle-password="signup-confirm-password" aria-label="Show password" title="Show password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                      <line x1="2" y1="2" x2="22" y2="22"></line>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Buttons Row: Back & Next -->
              <div class="auth-buttons-group">
                <button type="button" class="auth-btn-secondary" id="btn-signup-step2-back">Back</button>
                <button type="submit" class="auth-btn-primary" id="btn-signup-step2-submit">Next</button>
              </div>

              <!-- Footer Prompt -->
              <p class="auth-footer-prompt">
                Already have an account? <a href="login.html">Log in</a>
              </p>
            </div>

          </form>
        </div>

        <!-- Empty bottom spacer for symmetrical alignment -->
        <div class="auth-bottom-bar"></div>
      </div>

      <!-- Right Column: Editorial Campaign Image (sign-up-pic.jpg) -->
      <div class="auth-media-column">
        <img src="assets/sign-up-pic.jpg" alt="OGÉ Fine Jewelry Campaign" class="auth-media-img" loading="eager" width="1000" height="1200">
      </div>

    </div>
  </div>

</body>
</html>
