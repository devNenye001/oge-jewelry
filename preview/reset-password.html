<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — OGÉ Jewelry</title>
  <meta name="description" content="Reset your OGÉ Fine Jewelry account password. We'll send you an email with password recovery instructions.">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/base.css?v=5.0">
  <link rel="stylesheet" href="assets/theme.css?v=5.0">

  <script src="assets/theme.js?v=5.0" defer></script>
</head>
<body class="template-customers-reset-password">

  <div class="auth-page-wrapper">
    <div class="auth-split-grid">
      
      <!-- Left Column: Reset Password Form -->
      <div class="auth-form-column">
        <!-- Top Back Link -->
        <a href="login.html" class="auth-back-link" aria-label="Go Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Back</span>
        </a>

        <!-- Form Inner Container -->
        <div class="auth-form-inner">
          <h1 class="auth-title-serif">RESET PASSWORD</h1>
          
          <p class="auth-subtitle">We'll send you an email to reset your password.</p>

          <form id="form-auth-reset-password" novalidate>
            <!-- Email Address Field -->
            <div class="form-group-line" style="margin-bottom: 24px;">
              <label for="reset-email" class="form-label-line">Email address</label>
              <div class="form-input-line-wrap">
                <input type="email" id="reset-email" class="form-input-line" placeholder="name@email.com" required autocomplete="email">
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="auth-btn-primary" id="btn-reset-submit">Reset Password</button>

            <!-- Back to Login Link -->
            <div style="text-align: center; margin-top: 18px;">
              <a href="login.html" class="auth-forgot-link" style="font-size: 0.8125rem;">Back to login</a>
            </div>
          </form>
        </div>

        <!-- Bottom Spacer -->
        <div class="auth-bottom-bar"></div>
      </div>

      <!-- Right Column: Editorial Campaign Image (Victorious Collection) -->
      <div class="auth-media-column">
        <img src="assets/Victorious-collection.jpg" alt="Victorious Collection — OGÉ Fine Jewelry" class="auth-media-img" loading="eager" width="1000" height="1200">
      </div>

    </div>
  </div>

</body>
</html>
