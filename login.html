<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — OGÉ Jewelry</title>
  <meta name="description" content="Log in to your OGÉ Fine Jewelry account to access order history, wishlists, and account preferences.">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/base.css?v=5.0">
  <link rel="stylesheet" href="assets/theme.css?v=5.0">

  <script src="assets/theme.js?v=5.0" defer></script>
</head>
<body class="template-customers-login">

  <div class="auth-page-wrapper">
    <div class="auth-split-grid">
      
      <!-- Left Column: Login Form -->
      <div class="auth-form-column">
        <!-- Top Back Link -->
        <a href="index.html" class="auth-back-link" aria-label="Go Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Back</span>
        </a>

        <!-- Form Inner Container -->
        <div class="auth-form-inner">
          <a href="index.html" class="auth-logo-center" aria-label="OGÉ Home">
            <img src="assets/logo2.png" alt="OGÉ" class="auth-logo-img" width="90" height="28">
          </a>

          <p class="auth-subtitle">Log in to access your order history and account preferences.</p>

          <form id="form-auth-login" novalidate>
            <!-- Email Address Field -->
            <div class="form-group-line">
              <label for="login-email" class="form-label-line">Email address</label>
              <div class="form-input-line-wrap">
                <input type="email" id="login-email" class="form-input-line" placeholder="name@email.com" required autocomplete="email">
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group-line">
              <label for="login-password" class="form-label-line">Password</label>
              <div class="form-input-line-wrap">
                <input type="password" id="login-password" class="form-input-line" placeholder="Enter password" required autocomplete="current-password">
                <button type="button" class="password-eye-btn" data-toggle-password="login-password" aria-label="Show password" title="Show password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                      <line x1="2" y1="2" x2="22" y2="22"></line>
                    </svg>
                  </button>
              </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="auth-forgot-row">
              <a href="reset-password.html" class="auth-forgot-link" id="btn-forgot-password">I've forgotten my password</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="auth-btn-primary" id="btn-login-submit">Login</button>

            <!-- Footer Prompt -->
            <p class="auth-footer-prompt">
              Dont have an account? <a href="signup.html">Create an account here</a>
            </p>
          </form>
        </div>

        <!-- Bottom Accessibility Icon -->
        <div class="auth-bottom-bar">
          <div class="auth-badge-icon" title="Accessibility & Privacy Verified" aria-label="Accessibility">
            <span>◒</span>
          </div>
        </div>
      </div>

      <!-- Right Column: Editorial Campaign Image (Victorious Collection) -->
      <div class="auth-media-column">
        <img src="assets/Victorious-collection.jpg" alt="Victorious Collection — OGÉ Fine Jewelry" class="auth-media-img" loading="eager" width="1000" height="1200">
      </div>

    </div>
  </div>

</body>
</html>
